<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloth Physics Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            pointer-events: none;
            user-select: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #info h1 { margin: 0; font-size: 24px; font-weight: 300; }
        #info p { margin: 8px 0; font-size: 14px; opacity: 0.8; }
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }
        #controls label { display: block; margin: 8px 0 4px; }
        #controls input[type="range"] { width: 150px; }
        #controls .value { display: inline-block; width: 40px; text-align: right; }
    </style>
</head>
<body>

    <div id="info">
        <h1>🎐 Cloth Simulation</h1>
        <p>Left-click & drag on cloth to grab • Left-click in empty space to rotate • Scroll to zoom</p>
    </div>

    <div id="controls">
        <label>Wind Strength: <span id="windVal" class="value">5</span></label>
        <input type="range" id="windSlider" min="0" max="20" value="5">
        
        <label>Gravity: <span id="gravVal" class="value">-9.8</span></label>
        <input type="range" id="gravSlider" min="-30" max="0" value="-9.8">
        
        <label>Cloth Stiffness: <span id="stiffVal" class="value">5</span></label>
        <input type="range" id="stiffSlider" min="1" max="10" value="5">
        
        <button id="resetBtn" style="margin-top:10px;width:100%;padding:8px;cursor:pointer;">Reset Cloth</button>
        <button id="gustBtn" style="margin-top:5px;width:100%;padding:8px;cursor:pointer;">💨 Wind Gust</button>
    </div>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const config = {
            rows: 20,           // Cloth width segments (reduced for performance)
            cols: 15,           // Cloth height segments (reduced for performance)
            spacing: 2.0,       // Distance between points (larger = bigger cloth)
            gravity: -9.8,      // Gravity force (m/s²)
            windStrength: 5,    // Wind intensity
            floorY: -20,        // Floor collision level
            mouseForce: 500,    // Force applied by mouse interaction
            mouseRadius: 6,     // Radius around mouse click for interaction
            iterations: 5,      // Constraint solver iterations (reduced from 15)
            damping: 0.98,      // Velocity damping (air resistance)
            stiffness: 1.0,     // Constraint stiffness
        };

        let windGust = { active: false, strength: 0, direction: new THREE.Vector3() };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(30, 15, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for performance
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        dirLight.position.set(-30, 40, -20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        // Fill light for softer shadows
        const fillLight = new THREE.DirectionalLight(0x6688ff, 0.3);
        fillLight.position.set(20, 10, 20);
        scene.add(fillLight);

        // Rim light for edge definition
        const rimLight = new THREE.DirectionalLight(0xff6688, 0.2);
        rimLight.position.set(0, -10, 30);
        scene.add(rimLight);

        // --- Physics Objects ---
        const points = [];
        const sticks = [];
        
        let geometry, material, mesh;

        function initCloth() {
            // Clear existing
            points.length = 0;
            sticks.length = 0;
            if (mesh) scene.remove(mesh);
            if (geometry) geometry.dispose();

            // 1. Create the Points (Particles)
            for (let i = 0; i <= config.rows; i++) {
                for (let j = 0; j <= config.cols; j++) {
                    const x = i * config.spacing - (config.rows * config.spacing) / 2;
                    const y = j * config.spacing - (config.cols * config.spacing) / 2 + 15; // Start high
                    const z = 0;

                    points.push(new Point(x, y, z));
                }
            }

            // 2. Create Constraints (Sticks connecting points) - including diagonals for stability
            for (let i = 0; i <= config.rows; i++) {
                for (let j = 0; j <= config.cols; j++) {
                    const idx1 = i * (config.cols + 1) + j;

                    // Connect to right neighbor
                    if (i < config.rows) {
                        const idx2 = (i + 1) * (config.cols + 1) + j;
                        sticks.push(new Stick(points[idx1], points[idx2]));
                    }

                    // Connect to bottom neighbor
                    if (j < config.cols) {
                        const idx2 = i * (config.cols + 1) + (j + 1);
                        sticks.push(new Stick(points[idx1], points[idx2]));
                    }

                    // Diagonal constraints for shear resistance (every other point for performance)
                    if (i < config.rows && j < config.cols && (i + j) % 2 === 0) {
                        const idx2 = (i + 1) * (config.cols + 1) + (j + 1);
                        sticks.push(new Stick(points[idx1], points[idx2]));
                    }
                }
            }

            // 3. Pin both ends (like a clothesline)
            for (let i = 0; i <= config.rows; i++) {
                // Pin top-left corner area
                if (i < 3) {
                    const idx = i * (config.cols + 1); // Left edge, bottom row
                    points[idx].pin = true;
                }
                // Pin top-right corner area  
                if (i > config.rows - 3) {
                    const idx = i * (config.cols + 1); // Right edge, bottom row
                    points[idx].pin = true;
                }
            }

            // 4. Create Visual Mesh from Points
            const vertices = [];
            const indices = [];
            
            for (let i = 0; i <= config.rows; i++) {
                for (let j = 0; j <= config.cols; j++) {
                    vertices.push(0, 0, 0); // Placeholder positions
                }
            }
            
            for (let i = 0; i < config.rows; i++) {
                for (let j = 0; j < config.cols; j++) {
                    const a = i * (config.cols + 1) + j;
                    const b = a + 1;
                    const c = a + (config.cols + 1);
                    const d = c + 1;
                    indices.push(a, b, c);
                    indices.push(b, d, c);
                }
            }

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setIndex(indices);

            // Create gradient-like color attribute - brighter, more visible colors
            const colors = [];
            for (let i = 0; i <= config.rows; i++) {
                for (let j = 0; j <= config.cols; j++) {
                    // Gradient from top to bottom - vibrant teal/cyan colors
                    const t = j / config.cols;
                    colors.push(
                        0.1 + t * 0.3,  // R: teal to lighter
                        0.7 + t * 0.2,  // G: bright green-cyan
                        0.85 - t * 0.15 // B: cyan to lighter
                    );
                }
            }
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                side: THREE.DoubleSide,
                roughness: 0.4,
                metalness: 0.2,
                flatShading: false,
                emissive: new THREE.Color(0x113344),
                emissiveIntensity: 0.2,
            });

            mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            scene.add(mesh);

            // Sync initial positions
            syncMesh();
        }

        function resetCloth() {
            initCloth();
        }

        // --- Physics Classes ---

        class Point {
            constructor(x, y, z) {
                this.position = new THREE.Vector3(x, y, z);
                this.oldPosition = new THREE.Vector3(x, y, z);
                this.force = new THREE.Vector3(0, 0, 0);
                this.pin = false;
                this.grabbed = false; // Is being dragged by mouse
            }

            update(dt) {
                if (this.pin || this.grabbed) return;

                const velocity = new THREE.Vector3()
                    .subVectors(this.position, this.oldPosition)
                    .multiplyScalar(config.damping);

                this.oldPosition.copy(this.position);

                // Apply accumulated forces
                const acceleration = this.force.clone().multiplyScalar(1.0); // F=ma, assuming m=1
                
                // Verlet Integration
                const dtSq = dt * dt;
                const displacement = acceleration.multiplyScalar(dtSq).add(velocity.multiplyScalar(dt));

                this.position.add(displacement);

                // Floor Collision with bounce
                if (this.position.y < config.floorY) {
                    this.position.y = config.floorY;
                    const bounce = 0.3;
                    this.oldPosition.x += (this.position.x - this.oldPosition.x) * bounce;
                    this.oldPosition.z += (this.position.z - this.oldPosition.z) * bounce;
                }

                // Clear force accumulator
                this.force.set(0, 0, 0);
            }

            applyForce(force) {
                if (!this.pin && !this.grabbed) {
                    this.force.add(force);
                }
            }
        }

        class Stick {
            constructor(p1, p2) {
                this.p1 = p1;
                this.p2 = p2;
                this.length = p1.position.distanceTo(p2.position);
            }

            update() {
                const dx = this.p2.position.x - this.p1.position.x;
                const dy = this.p2.position.y - this.p1.position.y;
                const dz = this.p2.position.z - this.p1.position.z;

                const currentDist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                
                if (currentDist === 0) return;

                const diff = this.length - currentDist;
                
                // Softer constraints for more cloth-like behavior
                const stiffness = config.stiffness;
                const percent = (diff / currentDist) * 0.5 * stiffness;
                
                const offsetX = dx * percent;
                const offsetY = dy * percent;
                const offsetZ = dz * percent;

                if (!this.p1.pin && !this.p1.grabbed) {
                    this.p1.position.x -= offsetX;
                    this.p1.position.y -= offsetY;
                    this.p1.position.z -= offsetZ;
                }
                if (!this.p2.pin && !this.p2.grabbed) {
                    this.p2.position.x += offsetX;
                    this.p2.position.y += offsetY;
                    this.p2.position.z += offsetZ;
                }
            }
        }

        // --- Mouse Interaction ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isMouseDown = false;
        let grabbedPoints = []; // Points currently being held
        let grabOffset = new THREE.Vector3(); // Offset from grab point

        function getIntersectPoint(event) {
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mesh);
            
            if (intersects.length > 0) {
                return intersects[0].point;
            }
            return null;
        }

        function findNearbyPoints(point, radius) {
            const nearby = [];
            for (let p of points) {
                if (!p.pin && !p.grabbed) {
                    const dist = p.position.distanceTo(point);
                    if (dist < radius) {
                        nearby.push({ point: p, dist: dist });
                    }
                }
            }
            // Sort by distance and take closest few
            nearby.sort((a, b) => a.dist - b.dist);
            return nearby.slice(0, 5).map(n => n.point);
        }

        function onMouseDown(event) {
            if (event.button !== 0) return; // Only left click
            
            const intersect = getIntersectPoint(event);
            if (intersect) {
                isMouseDown = true;
                
                // Find and grab nearby points
                grabbedPoints = findNearbyPoints(intersect, config.mouseRadius * 2);
                
                // Mark points as grabbed
                for (let p of grabbedPoints) {
                    p.grabbed = true;
                    // Store offset from grab point
                    p.grabOffset = new THREE.Vector3().subVectors(p.position, intersect);
                }
            }
        }

        function onMouseUp() {
            isMouseDown = false;
            
            // Release all grabbed points
            for (let p of grabbedPoints) {
                p.grabbed = false;
            }
            grabbedPoints = [];
        }

        function onMouseMove(event) {
            if (!isMouseDown || grabbedPoints.length === 0) return;
            
            const intersect = getIntersectPoint(event);
            if (intersect) {
                // Move grabbed points with the mouse
                for (let p of grabbedPoints) {
                    const targetPos = intersect.clone().add(p.grabOffset || new THREE.Vector3());
                    
                    // Smoothly interpolate toward target
                    const lerpFactor = 0.5;
                    p.position.lerp(targetPos, lerpFactor);
                    
                    // Also update oldPosition for proper velocity calculation on release
                    p.oldPosition.lerp(targetPos, lerpFactor * 0.5);
                }
            }
        }

        // Touch events
        function onTouchStart(event) {
            event.preventDefault();
            const touch = event.touches[0];
            
            mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mesh);
            
            if (intersects.length > 0) {
                isMouseDown = true;
                grabbedPoints = findNearbyPoints(intersects[0].point, config.mouseRadius * 2);
                
                for (let p of grabbedPoints) {
                    p.grabbed = true;
                    p.grabOffset = new THREE.Vector3().subVectors(p.position, intersects[0].point);
                }
            }
        }

        function onTouchEnd(event) {
            isMouseDown = false;
            for (let p of grabbedPoints) {
                p.grabbed = false;
            }
            grabbedPoints = [];
        }

        function onTouchMove(event) {
            if (!isMouseDown || grabbedPoints.length === 0) return;
            event.preventDefault();
            
            const touch = event.touches[0];
            mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mesh);
            
            if (intersects.length > 0) {
                for (let p of grabbedPoints) {
                    const targetPos = intersects[0].point.clone().add(p.grabOffset || new THREE.Vector3());
                    p.position.lerp(targetPos, 0.5);
                    p.oldPosition.lerp(targetPos, 0.25);
                }
            }
        }

        document.addEventListener('mousedown', onMouseDown);
        document.addEventListener('mouseup', onMouseUp);
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('touchstart', onTouchStart, { passive: false });
        document.addEventListener('touchend', onTouchEnd);
        document.addEventListener('touchmove', onTouchMove, { passive: false });

        // --- UI Controls ---
        const windSlider = document.getElementById('windSlider');
        const gravSlider = document.getElementById('gravSlider');
        const stiffSlider = document.getElementById('stiffSlider');
        
        windSlider.addEventListener('input', (e) => {
            config.windStrength = parseFloat(e.target.value);
            document.getElementById('windVal').textContent = config.windStrength.toFixed(0);
        });
        
        gravSlider.addEventListener('input', (e) => {
            config.gravity = parseFloat(e.target.value);
            document.getElementById('gravVal').textContent = config.gravity.toFixed(1);
        });
        
        stiffSlider.addEventListener('input', (e) => {
            config.stiffness = parseFloat(e.target.value) / 5; // Scale to 0.2-2.0
            document.getElementById('stiffVal').textContent = e.target.value;
        });

        document.getElementById('resetBtn').addEventListener('click', resetCloth);
        
        document.getElementById('gustBtn').addEventListener('click', () => {
            windGust.active = true;
            windGust.strength = 30 + Math.random() * 20;
            windGust.direction.set(
                (Math.random() - 0.5) * 2,
                (Math.random() - 0.3),
                (Math.random() - 0.5) * 2
            ).normalize();
        });

        // --- Main Loop ---

        const clock = new THREE.Clock();
        
        function applyForces(dt, time) {
            const gravity = new THREE.Vector3(0, config.gravity * 10, 0);
            
            for (let p of points) {
                if (p.pin || p.grabbed) continue;

                // Gravity
                p.applyForce(gravity);

                // Wind - varies over time and space for natural fluttering
                const windX = Math.sin(time * 2 + p.position.y * 0.3) * config.windStrength;
                const windY = Math.sin(time * 1.5 + p.position.x * 0.2) * config.windStrength * 0.3;
                const windZ = Math.cos(time * 1.8 + p.position.z * 0.25) * config.windStrength * 0.7;
                
                // Add some turbulence
                const turbulence = Math.sin(time * 3 + p.position.x * 0.5) * Math.cos(time * 2.5 + p.position.y * 0.4);
                
                p.applyForce(new THREE.Vector3(windX + turbulence * 2, windY, windZ));

                // Wind gust effect
                if (windGust.active) {
                    const gustForce = windGust.direction.clone().multiplyScalar(windGust.strength);
                    // Gust affects points based on their position (wave effect)
                    const wavePhase = Math.sin(p.position.x * 0.2 + time * 5);
                    p.applyForce(gustForce.multiplyScalar(wavePhase * 0.5 + 0.5));
                }

                // Mouse repulsion (optional - push cloth away from cursor)
                // Could be added here if desired
            }

            // Decay wind gust
            if (windGust.active) {
                windGust.strength *= 0.92;
                if (windGust.strength < 1) {
                    windGust.active = false;
                }
            }
        }

        function syncMesh() {
            const posAttribute = geometry.attributes.position;
            
            for (let i = 0; i < points.length; i++) {
                posAttribute.setXYZ(i, points[i].position.x, points[i].position.y, points[i].position.z); 
            }

            posAttribute.needsUpdate = true;
            geometry.computeVertexNormals();
        }

        function updatePhysics() {
            const dt = Math.min(clock.getDelta(), 0.033); // Cap at ~30fps physics
            const time = clock.getElapsedTime();

            // Apply forces to all points
            applyForces(dt, time);

            // Update point positions (Verlet integration)
            for (let p of points) {
                p.update(dt);
            }

            // Solve constraints multiple times for stability
            const iterations = config.iterations; 
            for(let i = 0; i < iterations; i++) {
                for (let s of sticks) {
                    s.update();
                }
            }

            // Update visual mesh
            syncMesh();
        }

        initCloth();

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
        controls.minDistance = 10;
        controls.maxDistance = 100;
        
        // Track if mouse is over cloth to prevent orbit controls from interfering with grab
        let mouseOverCloth = false;
        
        function updateMouseState(event) {
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mesh);
            mouseOverCloth = intersects.length > 0;
            
            // Disable orbit controls when over cloth (so left-click can grab)
            controls.enableRotate = !mouseOverCloth;
        }
        
        document.addEventListener('mousemove', updateMouseState);
        
        function animate() {
            requestAnimationFrame(animate);
            
            updatePhysics();
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
