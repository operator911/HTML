<!DOCTYPE html>
<!-- 3D Airport Simulation -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Airport Simulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
canvas { display: block; }
#info {
  position: absolute; top: 10px; left: 10px; color: #fff;
  background: rgba(0,0,0,0.6); padding: 12px 18px; border-radius: 8px;
  font-size: 13px; pointer-events: none; line-height: 1.6;
}
#info h2 { margin-bottom: 4px; font-size: 15px; }
</style>
</head>
<body>
<div id="info">
  <h2>Airport 3D Simulation</h2>
  <div>Left Runway: Landings &nbsp;|&nbsp; Right Runway: Takeoffs</div>
  <div id="stats"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function() {

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0x87CEEB, 0.00015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 20000);
camera.position.set(800, 600, 800);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.2;
controls.minDistance = 100;
controls.maxDistance = 3000;

// --- Lighting ---
const ambientLight = new THREE.AmbientLight(0x6688cc, 0.5);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffee, 1.2);
sunLight.position.set(500, 800, 300);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 4096;
sunLight.shadow.mapSize.height = 4096;
sunLight.shadow.camera.near = 10;
sunLight.shadow.camera.far = 3000;
sunLight.shadow.camera.left = -2000;
sunLight.shadow.camera.right = 2000;
sunLight.shadow.camera.top = 2000;
sunLight.shadow.camera.bottom = -2000;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x556633, 0.4);
scene.add(hemiLight);

// --- Materials ---
const grassMat = new THREE.MeshLambertMaterial({ color: 0x4a7c3f });
const runwayMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
const tarmacMat = new THREE.MeshLambertMaterial({ color: 0x777777 });
const taxiwayMat = new THREE.MeshLambertMaterial({ color: 0x555555, side: THREE.DoubleSide });
const concreteMat = new THREE.MeshLambertMaterial({ color: 0x999999 });
const buildingMat = new THREE.MeshLambertMaterial({ color: 0xccbbaa });
const roofMat = new THREE.MeshLambertMaterial({ color: 0x887766 });
const glassMat = new THREE.MeshPhongMaterial({ color: 0x4488aa, transparent: true, opacity: 0.6 });
const whiteLineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const yellowLineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
const redLightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const greenLightMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

// --- Ground ---
const groundGeo = new THREE.PlaneGeometry(8000, 8000);
const ground = new THREE.Mesh(groundGeo, grassMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// --- Runways ---
function createRunway(x, z, length, width, rotation, nameLeft, nameRight) {
  const group = new THREE.Group();

  // Main runway surface
  const geo = new THREE.PlaneGeometry(width, length);
  const mesh = new THREE.Mesh(geo, runwayMat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.rotation.z = rotation || 0;
  mesh.position.set(x, 0.1, z);
  if (rotation) mesh.rotation.y = rotation;
  mesh.receiveShadow = true;
  group.add(mesh);

  // White edge lines
  const lineW = width - 20;
  for (let side of [-1, 1]) {
    const lineGeo = new THREE.PlaneGeometry(3, length);
    const line = new THREE.Mesh(lineGeo, whiteLineMat);
    line.rotation.x = -Math.PI / 2;
    if (rotation) {
      line.position.set(x + side * (lineW / 2), 0.2, z);
      line.rotation.z = rotation || 0;
    } else {
      line.position.set(x + side * (lineW / 2), 0.2, z);
    }
    group.add(line);
  }

  // Center dashed line
  const dashCount = Math.floor(length / 40);
  for (let i = 0; i < dashCount; i++) {
    const dashGeo = new THREE.PlaneGeometry(3, 15);
    const dash = new THREE.Mesh(dashGeo, whiteLineMat);
    dash.rotation.x = -Math.PI / 2;
    if (rotation) {
      dash.position.set(x, 0.2, z + (i * 40 - length / 2 + 20));
      dash.rotation.z = rotation || 0;
    } else {
      dash.position.set(x, 0.2, i * 40 - length / 2 + 20);
    }
    group.add(dash);
  }

  // Threshold markings (stripes at each end)
  for (let end of [-1, 1]) {
    const stripeCount = 6;
    for (let s = 0; s < stripeCount; s++) {
      const stripeGeo = new THREE.PlaneGeometry(8, length / (stripeCount + 1));
      const stripe = new THREE.Mesh(stripeGeo, whiteLineMat);
      stripe.rotation.x = -Math.PI / 2;
      if (rotation) {
        stripe.position.set(x + ((s % 2 === 0) ? -lineW/3 : lineW/3), 0.2, z + end * (length / 2 - 40));
        stripe.rotation.z = rotation || 0;
      } else {
        stripe.position.set(x + ((s % 2 === 0) ? -lineW/3 : lineW/3), 0.2, end * (length / 2 - 40));
      }
      group.add(stripe);
    }
  }

  // Runway numbers at each end
  const runwayLength = length;
  for (let end of [-1, 1]) {
    const numGeo = new THREE.PlaneGeometry(25, 10);
    const numCanvas = document.createElement('canvas');
    numCanvas.width = 128; numCanvas.height = 64;
    const ctx = numCanvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 128, 64);
    ctx.fillStyle = '#333333';
    ctx.font = 'bold 40px Arial';
    ctx.textAlign = 'center';
    const runwayName = end < 0 ? nameLeft : nameRight;
    ctx.fillText(runwayName, 64, 48);
    const numTex = new THREE.CanvasTexture(numCanvas);
    const numMat = new THREE.MeshBasicMaterial({ map: numTex });
    const numMesh = new THREE.Mesh(numGeo, numMat);
    numMesh.rotation.x = -Math.PI / 2;
    if (rotation) {
      numMesh.position.set(x, 0.3, z + end * (length / 2 - 15));
      numMesh.rotation.z = rotation || 0;
    } else {
      numMesh.position.set(x, 0.3, end * (length / 2 - 15));
    }
    group.add(numMesh);
  }

  // Runway edge lights (green for takeoff direction, red for landing)
  for (let i = 0; i < length / 30; i++) {
    const zPos = z + (i * 30 - length / 2);
    for (let side of [-1, 1]) {
      const lightGeo = new THREE.SphereGeometry(1.5, 6, 6);
      // Alternating green/red lights at runway ends
      const isEndLight = i < 3 || i > length / 30 - 3;
      const lightColor = isEndLight ? (i < 3 ? redLightMat : greenLightMat) : greenLightMat;
      const lightMesh = new THREE.Mesh(lightGeo, lightColor);
      if (rotation) {
        lightMesh.position.set(x + side * (width / 2 - 5), 2, zPos);
      } else {
        lightMesh.position.set(x + side * (width / 2 - 5), 2, zPos);
      }
      group.add(lightMesh);
    }
  }

  // Runway threshold lights (bright white at each end)
  for (let end of [-1, 1]) {
    const thresholdZ = z + end * (length / 2 - 5);
    for (let side of [-1, 1]) {
      const tGeo = new THREE.SphereGeometry(2, 8, 8);
      const tMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const tLight = new THREE.Mesh(tGeo, tMat);
      tLight.position.set(x + side * (width / 2 - 5), 2.5, thresholdZ);
      group.add(tLight);
    }
  }

  scene.add(group);
  return { x, z, length, width };
}

// Landing runway (left) - oriented roughly east-west
const landingRunway = createRunway(-300, 0, 2400, 150, 0, '09L', '27R');

// Takeoff runway (right) - parallel
const takeoffRunway = createRunway(300, 0, 2400, 150, 0, '09R', '27L');

// --- Taxiways ---
function createTaxiway(points, width) {
  const group = new THREE.Group();
  for (let i = 0; i < points.length - 1; i++) {
    const p1 = points[i], p2 = points[i + 1];
    const dx = p2.x - p1.x, dz = p2.z - p1.z;
    const len = Math.sqrt(dx * dx + dz * dz);
    const angle = Math.atan2(dz, dx);

    // Create taxiway segment - width is across the path, len is along the path
    const geo = new THREE.PlaneGeometry(width || 40, len);
    const mesh = new THREE.Mesh(geo, taxiwayMat);
    mesh.rotation.set(-Math.PI / 2, angle, 0, 'YXZ');
    mesh.position.set((p1.x + p2.x) / 2, 0.14, (p1.z + p2.z) / 2);
    mesh.receiveShadow = true;
    group.add(mesh);

    // Yellow center line dashes - oriented along the taxiway direction
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    for (let d = 8; d < len - 4; d += 20) {
      const dashGeo = new THREE.PlaneGeometry(2, 6); // width=2 (across), length=6 (along path)
      const dash = new THREE.Mesh(dashGeo, lineMat);
      // Rotate to lie flat and align with taxiway direction
      dash.rotation.set(-Math.PI / 2, angle, 0, 'YXZ');
      // Position along the center of the taxiway segment
      const localOffset = d - len / 2;
      dash.position.set(
        (p1.x + p2.x) / 2 + Math.sin(angle) * localOffset,
        0.15,
        (p1.z + p2.z) / 2 + Math.cos(angle) * localOffset
      );
      group.add(dash);
    }
  }
  scene.add(group);
}

// Taxiways connecting landing runway (left, centered at x=-300) to terminal area
// Start from runway EDGE (x=-225, which is -300 + 75) and go to terminal
createTaxiway([
  { x: -225, z: 600 }, { x: -150, z: 400 },
  { x: -150, z: 200 }, { x: -100, z: 200 }
], 35);
createTaxiway([
  { x: -225, z: -600 }, { x: -150, z: -400 },
  { x: -150, z: -200 }, { x: -100, z: -200 }
], 35);

// Right-side taxiways connecting takeoff runway (right, centered at x=300) to terminal area
// Start from runway EDGE (x=225, which is 300 - 75) and go to terminal
createTaxiway([
  { x: 225, z: 600 }, { x: 150, z: 400 },
  { x: 150, z: 200 }, { x: 100, z: 200 }
], 35);
createTaxiway([
  { x: 225, z: -600 }, { x: 150, z: -400 },
  { x: 150, z: -200 }, { x: 100, z: -200 }
], 35);

// Apron surface - single unified overlay to avoid z-fighting and overlapping artifacts
// This creates a seamless tarmac appearance over the apron area without multiple overlapping planes
const apronOverlayGeo = new THREE.PlaneGeometry(500, 700);
const apronOverlayMat = new THREE.MeshLambertMaterial({ color: 0x777777 });
const apronOverlay = new THREE.Mesh(apronOverlayGeo, apronOverlayMat);
apronOverlay.rotation.set(-Math.PI / 2, 0, 0, 'YXZ');
apronOverlay.position.set(0, 0.13, -50);
apronOverlay.receiveShadow = true;
scene.add(apronOverlay);

// Apron surface markings (painted lines on apron)
const apronLineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
// Parking position lines at each gate - slightly raised above apron to prevent z-fighting
for (let i = -4; i <= 4; i++) {
  const lineGeo = new THREE.PlaneGeometry(35, 2);
  const line = new THREE.Mesh(lineGeo, apronLineMat);
  line.rotation.set(-Math.PI / 2, 0, 0, 'YXZ');
  line.position.set(i * 55, 0.14, 60);
  scene.add(line);

  // Ground power unit markers
  const gpuGeo = new THREE.BoxGeometry(4, 3, 6);
  const gpuMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
  for (let side of [-1, 1]) {
    const gpu = new THREE.Mesh(gpuGeo, gpuMat);
    gpu.position.set(i * 55 + side * 22, 1.5, 60);
    scene.add(gpu);
  }
}

// Gate position ring markers on apron (flat on ground) - raised above overlay
for (let i = -4; i <= 4; i++) {
  const markerGeo = new THREE.RingGeometry(10, 12, 16);
  const markerMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
  const marker = new THREE.Mesh(markerGeo, markerMat);
  marker.rotation.set(-Math.PI / 2, 0, 0, 'YXZ');
  marker.position.set(i * 55, 0.145, 60);
  scene.add(marker);
}

// --- Terminal Building ---
function createTerminal(x, z, width, depth) {
  const group = new THREE.Group();

  // Main building
  const buildGeo = new THREE.BoxGeometry(width, 40, depth);
  const building = new THREE.Mesh(buildGeo, buildingMat);
  building.position.set(x, 20, z);
  building.castShadow = true;
  building.receiveShadow = true;
  group.add(building);

  // Roof
  const roofGeo = new THREE.BoxGeometry(width + 10, 5, depth + 10);
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.set(x, 42, z);
  roof.castShadow = true;
  group.add(roof);

  // Windows (glass strips along the sides)
  for (let side of [-1, 1]) {
    const winGeo = new THREE.PlaneGeometry(width - 20, 15);
    const win = new THREE.Mesh(winGeo, glassMat);
    win.position.set(x, 25, z + side * (depth / 2 + 0.5));
    if (side > 0) win.rotation.y = Math.PI;
    group.add(win);
  }

  scene.add(group);
  return { x, z, width, depth };
}

const terminal = createTerminal(0, -100, 500, 80);

// --- Gates (Jets / Boarding Bridges) ---
function createGate(x, z, side, gateIndex) {
  const group = new THREE.Group();

  // Gate position marker - flat painted circle on tarmac (no tall cylinder)
  const circleCanvas = document.createElement('canvas');
  circleCanvas.width = 128; circleCanvas.height = 128;
  const cCtx = circleCanvas.getContext('2d');
  cCtx.fillStyle = '#ffcc00';
  cCtx.beginPath();
  cCtx.arc(64, 64, 58, 0, Math.PI * 2);
  cCtx.stroke();
  cCtx.font = 'bold 36px Arial';
  cCtx.textAlign = 'center';
  cCtx.fillStyle = '#ffcc00';
  cCtx.fillText('A' + (gateIndex + 5), 64, 72);
  const circleTex = new THREE.CanvasTexture(circleCanvas);

  // Jet bridge (boarding bridge) - extends from terminal toward gate position
  const bridgeLength = Math.abs(z - (-100)); // distance from terminal center
  const bridgeGeo = new THREE.BoxGeometry(8, 6, Math.min(bridgeLength, 50));
  const bridgeMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
  const bridgeDir = z > -100 ? 1 : -1;
  const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
  bridge.position.set(x + (side * -15), 12, z + (z > -100 ? -bridgeLength/2 + 25 : bridgeLength/2 - 25));
  bridge.castShadow = true;
  group.add(bridge);

  // Gate number sign on terminal wall
  const signCanvas = document.createElement('canvas');
  signCanvas.width = 64; signCanvas.height = 32;
  const sCtx = signCanvas.getContext('2d');
  sCtx.fillStyle = '#003366';
  sCtx.fillRect(0, 0, 64, 32);
  sCtx.fillStyle = '#ffffff';
  sCtx.font = 'bold 18px Arial';
  sCtx.textAlign = 'center';
  sCtx.fillText('A' + (gateIndex + 5), 32, 24);
  const signTex = new THREE.CanvasTexture(signCanvas);
  const signGeo = new THREE.PlaneGeometry(10, 5);
  const signMat = new THREE.MeshBasicMaterial({ map: signTex });
  const sign = new THREE.Mesh(signGeo, signMat);
  sign.position.set(x, 28, -100 + (side > 0 ? 41 : -41));
  if (side < 0) sign.rotation.y = Math.PI;
  group.add(sign);

  scene.add(group);
  return { x, z };
}

const gates = [];
for (let i = -4; i <= 4; i++) {
  const gateX = i * 55;
  // Alternate sides: even-indexed gates on front side, odd on back
  const side = i % 2 === 0 ? 1 : -1;
  const gateZ = -60 + (side * 40);
  gates.push(createGate(gateX, gateZ, side, i));
}

// --- Control Tower ---
function createTower(x, z) {
  const group = new THREE.Group();

  // Base
  const baseGeo = new THREE.CylinderGeometry(25, 30, 80, 8);
  const base = new THREE.Mesh(baseGeo, buildingMat);
  base.position.set(x, 40, z);
  base.castShadow = true;
  group.add(base);

  // Top cabin
  const cabinGeo = new THREE.CylinderGeometry(20, 25, 20, 8);
  const cabin = new THREE.Mesh(cabinGeo, glassMat);
  cabin.position.set(x, 90, z);
  group.add(cabin);

  // Roof
  const topGeo = new THREE.ConeGeometry(22, 15, 8);
  const top = new THREE.Mesh(topGeo, roofMat);
  top.position.set(x, 107, z);
  top.castShadow = true;
  group.add(top);

  scene.add(group);
}
createTower(-350, -200);

// --- Cargo / Maintenance Buildings ---
function createBuilding(x, z, w, d, h) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, buildingMat);
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const roofGeo = new THREE.BoxGeometry(w + 5, 3, d + 5);
  const roofMesh = new THREE.Mesh(roofGeo, roofMat);
  roofMesh.position.set(x, h + 1.5, z);
  roofMesh.castShadow = true;
  scene.add(roofMesh);

  // Loading docks on one side
  for (let i = 0; i < Math.floor(d / 20); i++) {
    const dockGeo = new THREE.BoxGeometry(w * 0.15, h * 0.6, 4);
    const dockMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
    const dock = new THREE.Mesh(dockGeo, dockMat);
    dock.position.set(x + (i - Math.floor(d / 40)) * (w / (Math.floor(d / 20) + 1)), h * 0.3, z + d / 2 + 2);
    scene.add(dock);
  }
}

createBuilding(-700, -250, 200, 120, 35);
createBuilding(700, -250, 180, 100, 30);

for (let i = 0; i < 60; i++) {

// --- Airplane Model Builder ---
// Build airplane with correct orientation from the start:
// - Fuselage along +Z axis (nose at +Z end, tail at -Z end)
// - Wings horizontal (along X axis, left wing +X, right wing -X)
// - Vertical stabilizer along +Y axis (upward)
function createAirplane(color, scale) {
  const s = scale || 1;
  const group = new THREE.Group();

  // Fuselage (more realistic proportions - narrower body)
  // Cylinder default: along Y axis. We rotate Z by PI/2 to make it along X, then we'll fix below.
  // Actually, let's build with fuselage directly along +Z to avoid any rotation issues.
  const fuselageGeo = new THREE.CylinderGeometry(3 * s, 2.5 * s, 50 * s, 12);
  const bodyMat = new THREE.MeshPhongMaterial({ color: 0xeeeeee });
  // Rotate so cylinder points along Z axis (default is Y)
  const fuselage = new THREE.Mesh(fuselageGeo, bodyMat);
  fuselage.rotation.x = Math.PI / 2;
  group.add(fuselage);

  // Color stripe along fuselage (airline livery)
  const stripeGeo = new THREE.CylinderGeometry(3.1 * s, 2.6 * s, 48 * s, 12, 1, true, -0.4, 0.8);
  const stripeMat = new THREE.MeshPhongMaterial({ color: color });
  const stripe = new THREE.Mesh(stripeGeo, stripeMat);
  stripe.rotation.x = Math.PI / 2;
  group.add(stripe);

  // Nose cone (pointed front) - nose points along +Z axis
  const noseGeo = new THREE.ConeGeometry(3 * s, 10 * s, 12);
  const nose = new THREE.Mesh(noseGeo, bodyMat);
  // Cone default: along Y axis. Rotate X by PI/2 to point along +Z
  nose.rotation.x = Math.PI / 2;
  nose.position.z = 30 * s;
  group.add(nose);

  // Tail cone (tapered rear) - tail points along -Z axis
  const tailConeGeo = new THREE.ConeGeometry(2.5 * s, 8 * s, 12);
  const tailCone = new THREE.Mesh(tailConeGeo, bodyMat);
  // Rotate X by -PI/2 to point along -Z
  tailCone.rotation.x = -Math.PI / 2;
  tailCone.position.z = -29 * s;
  group.add(tailCone);

  // Main wings (realistic swept wing shape)
  // Build wings as proper horizontal surfaces using custom BufferGeometry
  // Fuselage is along +Z axis, so wings must extend along ±X axis
  function createWing(side) {
    // side: 1 = left wing (+X), -1 = right wing (-X)
    const chord = 6 * s;     // wing chord (front-to-back)
    const span = 18 * s;     // half-span (outward from body)
    const thickness = 1.2 * s;
    const sweepAngle = Math.atan2(5 * s, 18 * s); // swept back
    const sweepOffset = 5 * s;

    const vertices = [];
    const indices = [];

    // Bottom face (y = -thickness/2)
    // Front-left corner (near fuselage, swept back)
    vertices.push(-side * 0.5 * s, -thickness / 2, sweepOffset);      // 0: front inner bottom
    // Rear-left corner
    vertices.push(-side * 0.5 * s, -thickness / 2, -sweepOffset);     // 1: rear inner bottom
    // Rear wingtip
    vertices.push(side * span, -thickness / 2, -sweepOffset);          // 2: rear outer bottom
    // Front wingtip
    vertices.push(side * span, -thickness / 2, sweepOffset);           // 3: front outer bottom

    // Top face (y = +thickness/2)
    vertices.push(-side * 0.5 * s, thickness / 2, sweepOffset);       // 4: front inner top
    vertices.push(-side * 0.5 * s, thickness / 2, -sweepOffset);      // 5: rear inner top
    vertices.push(side * span, thickness / 2, -sweepOffset);           // 6: rear outer top
    vertices.push(side * span, thickness / 2, sweepOffset);            // 7: front outer top

    // Bottom face triangles
    indices.push(0, 1, 2); indices.push(0, 2, 3);
    // Top face triangles
    indices.push(4, 6, 5); indices.push(4, 7, 6);
    // Front face (fuselage side to wingtip front)
    indices.push(0, 3, 7); indices.push(0, 7, 4);
    // Rear face
    indices.push(1, 5, 2); indices.push(1, 2, 5);
    // Inner face (fuselage side)
    indices.push(0, 4, 1); indices.push(1, 4, 5);
    // Wingtip face (outer end)
    indices.push(3, 6, 2); indices.push(3, 7, 6);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, bodyMat);
  }

  const leftWing = createWing(1);   // extends along +X
  leftWing.position.set(0, -2.5 * s, 0);
  group.add(leftWing);

  const rightWing = createWing(-1);  // extends along -X
  rightWing.position.set(0, -2.5 * s, 0);
  group.add(rightWing);

  // Wing engines (pods) - mounted below wings
  for (let side of [1, -1]) {
    // Pylon connecting engine to wing (vertical strut)
    const pylonGeo = new THREE.BoxGeometry(1.5 * s, 2 * s, 4 * s);
    const pylon = new THREE.Mesh(pylonGeo, bodyMat);
    pylon.position.set(side * 6 * s, -3.5 * s, 12 * s);
    group.add(pylon);

    // Engine (cylinder pointing along Z axis, mounted on pylon)
    const engineGeo = new THREE.CylinderGeometry(2 * s, 1.6 * s, 7 * s, 8);
    const engineMat = new THREE.MeshPhongMaterial({ color: 0x888888, shininess: 50 });
    const engine = new THREE.Mesh(engineGeo, engineMat);
    // Engine axis is along Z (default cylinder orientation after rotation)
    engine.rotation.x = Math.PI / 2;
    engine.position.set(side * 6 * s, -4.5 * s, 12 * s);
    group.add(engine);

    // Engine exhaust ring (at rear of engine, which is along -Z)
    const exhaustGeo = new THREE.TorusGeometry(1.5 * s, 0.3 * s, 6, 8);
    const exhaustMat = new THREE.MeshPhongMaterial({ color: 0x444444 });
    const exhaust = new THREE.Mesh(exhaustGeo, exhaustMat);
    exhaust.position.set(side * 6 * s, -4.5 * s, 8.5 * s);
    group.add(exhaust);
  }

  // Vertical stabilizer (tail fin) - proper vertical surface using BufferGeometry
  // Drawn in YZ plane: Y=height (upward), Z=chord (front-to-back along fuselage)
  function createVerticalStabilizer(colorMat, s) {
    const thickness = 1.2 * s;
    const chordOffset = 3 * s;   // front edge offset
    const height = 10 * s;
    const sweepBack = 5 * s;     // rear edge sweeps backward

    const vertices = [];
    const indices = [];

    // Front edge (near fuselage)
    vertices.push(-thickness / 2, 0, chordOffset);       // 0: front bottom
    vertices.push(-thickness / 2, height, chordOffset);   // 1: front top
    // Rear edge (swept back, shorter at top)
    vertices.push(thickness / 2, 0, -chordOffset);        // 2: rear bottom
    vertices.push(thickness / 2, height * 0.9, -chordOffset - sweepBack); // 3: rear top

    // Front face (fuselage side)
    indices.push(0, 1, 2); indices.push(1, 3, 2);
    // Back face
    indices.push(2, 1, 0); indices.push(2, 3, 1);
    // Top edge
    indices.push(1, 3, 0); indices.push(3, 2, 0);
    // Bottom edge
    indices.push(0, 2, 1); indices.push(2, 3, 1);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, colorMat);
  }

  // Vertical stabilizer material (needs to be defined before use)
  const tailFinMat = new THREE.MeshPhongMaterial({ color: color });
  const tailFin = createVerticalStabilizer(tailFinMat, s);
  tailFin.position.set(0, 0, -24 * s);
  group.add(tailFin);

  // Horizontal stabilizers (smaller swept wings on both sides at tail)
  function createHStab(side) {
    // side: 1 = left (+X), -1 = right (-X)
    const chord = 4 * s;
    const span = 6 * s;
    const thickness = 0.8 * s;
    const sweepOffset = 3 * s;

    const vertices = [];
    const indices = [];

    // Bottom
    vertices.push(-side * 0.5 * s, -thickness / 2, sweepOffset);      // 0
    vertices.push(-side * 0.5 * s, -thickness / 2, -sweepOffset);     // 1
    vertices.push(side * span, -thickness / 2, -sweepOffset);          // 2
    vertices.push(side * span, -thickness / 2, sweepOffset);           // 3
    // Top
    vertices.push(-side * 0.5 * s, thickness / 2, sweepOffset);       // 4
    vertices.push(-side * 0.5 * s, thickness / 2, -sweepOffset);      // 5
    vertices.push(side * span, thickness / 2, -sweepOffset);           // 6
    vertices.push(side * span, thickness / 2, sweepOffset);            // 7

    indices.push(0,1,2, 0,2,3, 4,6,5, 4,7,6, 0,3,7, 0,7,4, 1,5,2, 1,2,5, 0,4,1, 1,4,5, 3,6,2, 3,7,6);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color: color }));
  }

  const leftHStab = createHStab(1);
  leftHStab.position.set(0, 1.5 * s, -22 * s);
  group.add(leftHStab);

  const rightHStab = createHStab(-1);
  rightHStab.position.set(0, 1.5 * s, -22 * s);
  group.add(rightHStab);

  // Cockpit windows (windshield) - on top of nose, facing forward (+Z) and to sides
  const cockpitGeo = new THREE.PlaneGeometry(5 * s, 3 * s);
  const cockpitMat = new THREE.MeshPhongMaterial({ color: 0x112244, shininess: 100 });
  for (let i = 0; i < 2; i++) {
    const win = new THREE.Mesh(cockpitGeo, cockpitMat);
    // Position on sides of nose cone area
    win.position.set((i - 0.5) * 3.5 * s, 2.5 * s, 25 * s);
    if (i === 0) {
      win.rotation.y = Math.PI / 2;  // Right side faces +X
    } else {
      win.rotation.y = -Math.PI / 2;  // Left side faces -X
    }
    group.add(win);
  }

  // Passenger windows (small dots along fuselage sides)
  const windowMat = new THREE.MeshBasicMaterial({ color: 0xaaddff });
  for (let side of [1, -1]) {
    for (let i = 0; i < 12; i++) {
      const pwGeo = new THREE.CircleGeometry(0.4 * s, 6);
      const pw = new THREE.Mesh(pwGeo, windowMat);
      // Along fuselage sides at +/-X, from nose to tail
      pw.position.set(side * (3.05 * s), 2 * s, 15 * s - i * 3 * s);
      if (side < 0) pw.rotation.y = Math.PI;
      group.add(pw);
    }
  }

  // Landing lights (nose gear area)
  const lightGeo = new THREE.SphereGeometry(0.8 * s, 6, 6);
  const noseLight = new THREE.Mesh(lightGeo, new THREE.MeshBasicMaterial({ color: 0xffffcc }));
  noseLight.position.set(0, -3 * s, 25 * s);
  group.add(noseLight);

  // Beacon (rotating red/white on top of fuselage) - stored with name for reliable access
  const beaconGeo = new THREE.SphereGeometry(1.2 * s, 6, 6);
  const beaconMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  const beacon = new THREE.Mesh(beaconGeo, beaconMat);
  beacon.name = 'beacon';
  beacon.position.set(0, 3.5 * s, -8 * s);
  group.add(beacon);

  // Navigation lights (wingtips) - stored with names
  for (let side of [1, -1]) {
    const navLightGeo = new THREE.SphereGeometry(1 * s, 6, 6);
    const navColor = side > 0 ? 0x00ff00 : 0xff0000;
    const navMat = new THREE.MeshBasicMaterial({ color: navColor });
    const navLight = new THREE.Mesh(navLightGeo, navMat);
    navLight.name = side > 0 ? 'navRight' : 'navLeft';
    // Left wingtip (+X), right wingtip (-X)
    navLight.position.set(side * 18 * s, -2.5 * s, 12 * s);
    group.add(navLight);
  }

  // Landing gear (simplified)
  const gearMat = new THREE.MeshPhongMaterial({ color: 0x444444 });
  // Nose gear
  const noseGearGeo = new THREE.CylinderGeometry(0.6 * s, 0.6 * s, 5 * s, 6);
  const noseGear = new THREE.Mesh(noseGearGeo, gearMat);
  noseGear.position.set(0, -4 * s, 18 * s);
  group.add(noseGear);

  // Main gear struts - extended down to connect near wheel axle
  for (let side of [1, -1]) {
    const mainGearGeo = new THREE.CylinderGeometry(0.7 * s, 0.7 * s, 8 * s, 6);
    const mainGear = new THREE.Mesh(mainGearGeo, gearMat);
    mainGear.position.set(side * 6 * s, -4 * s, 10 * s);
    group.add(mainGear);

    // Wheels (two per main gear)
    for (let w = -1; w <= 1; w += 2) {
      const wheelGeo = new THREE.CylinderGeometry(1.2 * s, 1.2 * s, 0.6 * s, 8);
      const wheelMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.rotation.x = Math.PI / 2;
      wheel.position.set(side * 6 * s, -7.5 * s, 10 * s + w * 1.2 * s);
      group.add(wheel);
    }
  }

  // Tail light (red, at rear)
  const tailLightGeo = new THREE.SphereGeometry(0.8 * s, 6, 6);
  const tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  const tailLight = new THREE.Mesh(tailLightGeo, tailLightMat);
  tailLight.position.set(0, 1.5 * s, -28 * s);
  group.add(tailLight);

  return group;
}

// Ground offset: lowest point of model is ~8.7s (wheel bottom), so add 9*s to raise wheels to ground
const GROUND_OFFSET = 9;

// --- Plane States ---
const PLANE_STATES = {
  TAXI_TO_RUNWAY: 'taxi_to_runway',
  ON_RUNWAY_TAKEOFF: 'on_runway_takeoff',
  CLIMBING: 'climbing',
  CRUISING: 'cruising',
  DESCENDING: 'descending',
  ON_RUNWAY_LANDING: 'on_runway_landing',
  TAXI_TO_GATE: 'taxi_to_gate',
  AT_GATE: 'at_gate'
};

const planes = [];
const planeColors = [0xcc2233, 0x2244aa, 0xdd6600, 0x117755, 0x8833aa, 0x2288cc, 0xaa4422, 0x336699];
let planeCount = 0;

function getGatePosition() {
  return gates[Math.floor(Math.random() * gates.length)];
}

function spawnPlane(state) {
  const color = planeColors[planeCount % planeColors.length];
  const scale = 0.8 + Math.random() * 0.5;
  const airplane = createAirplane(color, scale);
  scene.add(airplane);

  const gate = getGatePosition();
  const isTakeoff = state === PLANE_STATES.TAXI_TO_RUNWAY;

  const planeData = {
    mesh: airplane,
    state: state,
    speed: 0,
    targetSpeed: isTakeoff ? 3.5 : 2.5,
    scale: scale,
    gateX: gate.x,
    gateZ: gate.z,
    runwayX: isTakeoff ? takeoffRunway.x : landingRunway.x,
    taxiInPoint: { x: isTakeoff ? 300 : -300, z: isTakeoff ? 600 : (Math.random() > 0.5 ? 600 : -600) },
    runwayEndZ: 1200,
    taxiOutPoint: { x: -300, z: 800 },
    climbAngle: 0.04,
    cruiseAltitude: 1200 + Math.random() * 800,
    cruiseDistance: 3000 + Math.random() * 2000,
    distanceTraveled: 0,
    direction: isTakeoff ? 1 : -1,
    beaconPhase: Math.random() * Math.PI * 2,
    navLightPhase: Math.random() * Math.PI * 2,
    landed: false
  };

  if (isTakeoff) {
    airplane.position.set(planeData.gateX, GROUND_OFFSET * scale, planeData.gateZ);
    // Face direction of travel will be handled by TAXI_TO_RUNWAY state
    airplane.rotation.y = Math.atan2(
      planeData.taxiInPoint.x - airplane.position.x,
      planeData.taxiInPoint.z - airplane.position.z
    );
  } else {
    // Start off-screen for landing planes (far in +Z direction, flying toward -Z... no wait)
    // Landing planes approach from far away and fly along +Z toward the runway threshold
    const startZ = -3500;
    airplane.position.set(landingRunway.x, 1500, startZ);
    // Face +Z direction (forward along approach path)
    airplane.rotation.y = 0;
    airplane.rotation.x = -planeData.climbAngle;
  }

  planes.push(planeData);
  planeCount++;
}

// --- Initial Planes ---
for (let i = 0; i < 3; i++) {
  spawnPlane(PLANE_STATES.TAXI_TO_RUNWAY);
}
spawnPlane(PLANE_STATES.DESCENDING);

// --- Animation Loop ---
const clock = new THREE.Clock();
let statsUpdateTimer = 0;
let activeTakeoffs = 0;
let activeLandings = 0;

function updatePlane(plane, dt) {
  const m = plane.mesh;
  plane.beaconPhase += dt * 3;
  plane.navLightPhase += dt * 2;

  // Beacon blink (using named reference for reliable access)
  const beaconMesh = m.getObjectByName('beacon');
  if (beaconMesh) {
    beaconMesh.material.color.setHex(Math.sin(plane.beaconPhase) > 0 ? 0xff0000 : 0xffffff);
  }

  // Navigation light blink
  const navLeft = m.getObjectByName('navLeft');
  const navRight = m.getObjectByName('navRight');
  if (navLeft) navLeft.material.color.setHex(Math.sin(plane.navLightPhase) > 0 ? 0xff0000 : 0x330000);
  if (navRight) navRight.material.color.setHex(Math.sin(plane.navLightPhase) > 0 ? 0x00ff00 : 0x003300);

  switch (plane.state) {
    case PLANE_STATES.TAXI_TO_RUNWAY: {
      // Maintain ground altitude during taxi to runway
      const groundY = GROUND_OFFSET * plane.scale;
      if (m.position.y < groundY) m.position.y = groundY;
      plane.speed = THREE.MathUtils.lerp(plane.speed, plane.targetSpeed, dt * 2);
      const dx = plane.taxiInPoint.x - m.position.x;
      const dz = plane.taxiInPoint.z - m.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);

      if (dist < 5) {
        // Reached runway entry, turn onto runway and face direction of travel
        plane.state = PLANE_STATES.ON_RUNWAY_TAKEOFF;
        plane.speed = 0;
        m.position.x = plane.taxiInPoint.x;
        // Face +Z direction (along runway for takeoff)
        m.rotation.y = 0;
      } else {
        const nx = dx / dist, nz = dz / dist;
        m.position.x += nx * plane.speed * dt * 60;
        m.position.z += nz * plane.speed * dt * 60;

        // Face direction of travel (rotation.y: 0=+Z, PI/2=+X, PI=-Z, -PI/2=-X)
        const targetAngle = Math.atan2(nx, nz);
        let angleDiff = targetAngle - m.rotation.y;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        m.rotation.y += angleDiff * dt * 5;
      }
      break;
    }

    case PLANE_STATES.ON_RUNWAY_TAKEOFF: {
      plane.speed = THREE.MathUtils.lerp(plane.speed, 6 + Math.random() * 0.5, dt * 1.5);
      // Keep wheels on ground during takeoff roll
      const groundY = GROUND_OFFSET * plane.scale;
      if (m.position.y < groundY) m.position.y = groundY;
      // Move along +Z (forward in model's local space)
      m.position.z += plane.speed * dt * 60;

      // Slight nose-up rotation as speed increases (rotation simulation)
      if (plane.speed > 3) {
        const rotateProgress = Math.min((plane.speed - 3) / 4, 1);
        m.rotation.x = THREE.MathUtils.lerp(m.rotation.x, -0.06 * rotateProgress, dt * 3);
      }

      // Check if reached runway end (absolute Z position)
      if (m.position.z >= plane.runwayEndZ) {
        plane.state = PLANE_STATES.CLIMBING;
        m.rotation.x = -plane.climbAngle;
      }

      // Add thrust particles effect (simple speed lines)
      if (plane.speed > 3) {
        const trailGeo = new THREE.SphereGeometry(0.5 * plane.scale, 4, 4);
        const trailMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.6 });
        for (let t = -1; t <= 1; t++) {
          const trail = new THREE.Mesh(trailGeo, trailMat);
          // Trail appears behind the plane (negative local Z)
          trail.position.set(
            m.position.x + (Math.random() - 0.5) * 4 * plane.scale,
            m.position.y - 3 * plane.scale,
            m.position.z + (-15 * plane.scale)
          );
          scene.add(trail);
          setTimeout(() => { if (trail.parent) scene.remove(trail); }, 500);
        }
      }
      break;
    }

    case PLANE_STATES.CLIMBING: {
      m.position.y += plane.climbAngle * plane.speed * dt * 60;
      // Move forward along +Z
      m.position.z += plane.speed * dt * 30;
      plane.distanceTraveled += plane.speed * dt * 60;

      if (m.position.y >= plane.cruiseAltitude) {
        plane.state = PLANE_STATES.CRUISING;
        m.rotation.x = 0;
      }
      break;
    }

    case PLANE_STATES.CRUISING: {
      // Move forward along +Z at cruise altitude
      m.position.z += plane.speed * dt * 60;
      plane.distanceTraveled += plane.speed * dt * 60;

      // Gentle banking turns for visual interest
      const bankPhase = plane.distanceTraveled * 0.001;
      m.rotation.z = Math.sin(bankPhase) * 0.15;

      if (plane.distanceTraveled >= plane.cruiseDistance) {
        plane.state = PLANE_STATES.DESCENDING;
        plane.descendStartZ = m.position.z;
        plane.descendStartY = m.position.y;
        m.rotation.x = -0.02;
      }
      break;
    }

    case PLANE_STATES.DESCENDING: {
      // Smooth descent tied to Z progress toward runway
      const startZ = plane.descendStartZ || 3500;
      const startY = plane.descendStartY || 800;
      const endZ = plane.taxiOutPoint.z;
      const zProgress = Math.max(0, (m.position.z - endZ) / (startZ - endZ));
      const targetY = Math.max(2, startY * zProgress);
      m.position.y = THREE.MathUtils.lerp(m.position.y, targetY, dt * 4);

      // Move forward along +Z
      m.position.z += plane.speed * dt * 30;
      plane.distanceTraveled += plane.speed * dt * 60;

      if (m.position.z <= endZ) {
        plane.state = PLANE_STATES.ON_RUNWAY_LANDING;
        m.position.y = Math.max(2, m.position.y);
        m.rotation.x = 0.02; // Slight nose-up for flare
        plane.speed = 5.5;
      }
      break;
    }

    case PLANE_STATES.ON_RUNWAY_LANDING: {
      // Face +Z direction (forward along runway)
      m.rotation.y = 0;
      plane.speed = THREE.MathUtils.lerp(plane.speed, 5.5, dt * 1);
      // Move forward along +Z
      m.position.z += plane.speed * dt * 60;
      plane.speed *= (1 - dt * 0.3); // Decelerate

      // Flare recovery - level out completely
      m.rotation.x = THREE.MathUtils.lerp(m.rotation.x, 0, dt * 5);

      // Keep wheels on ground during landing roll
      const groundY = GROUND_OFFSET * plane.scale;
      if (m.position.y < groundY) m.position.y = groundY;

      if (plane.speed < 2) {
        plane.state = PLANE_STATES.TAXI_TO_GATE;
        plane.speed = 0;
        // Set proper ground altitude for taxiing
        m.position.y = groundY;
        const dx = plane.gateX - m.position.x;
        const dz = plane.gateZ - m.position.z;
        // Face direction of travel to gate
        m.rotation.y = Math.atan2(dx, dz);
      }
      break;
    }

    case PLANE_STATES.TAXI_TO_GATE: {
      // Maintain ground altitude during taxi
      const groundY = GROUND_OFFSET * plane.scale;
      if (m.position.y < groundY) m.position.y = groundY;
      plane.speed = THREE.MathUtils.lerp(plane.speed, plane.targetSpeed * 0.7, dt * 2);
      const dx = plane.gateX - m.position.x;
      const dz = plane.gateZ - m.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);

      if (dist < 5) {
        plane.state = PLANE_STATES.AT_GATE;
        plane.speed = 0;
        m.position.x = plane.gateX;
        m.position.z = plane.gateZ;
        // Face the terminal (+Z direction toward terminal)
        m.rotation.y = 0;
      } else {
        const nx = dx / dist, nz = dz / dist;
        m.position.x += nx * plane.speed * dt * 60;
        m.position.z += nz * plane.speed * dt * 60;

        // Face direction of travel (rotation.y: 0=+Z, PI/2=+X)
        const targetAngle = Math.atan2(nx, nz);
        let angleDiff = targetAngle - m.rotation.y;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        m.rotation.y += angleDiff * dt * 5;
      }
      break;
    }

    case PLANE_STATES.AT_GATE: {
      // Maintain ground altitude at gate
      const groundY = GROUND_OFFSET * plane.scale;
      if (m.position.y < groundY) m.position.y = groundY;
      // Idle at gate, slight beacon animation only
      break;
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  controls.update();

  for (let i = planes.length - 1; i >= 0; i--) {
    const plane = planes[i];
    updatePlane(plane, dt);

    // Remove planes that have reached gate and been idle too long
    if (plane.state === PLANE_STATES.AT_GATE) {
      plane.idleTime = (plane.idleTime || 0) + dt;
      if (plane.idleTime > 12) {
        scene.remove(plane.mesh);
        planes.splice(i, 1);

        // Spawn a new takeoff plane to replace it
        setTimeout(() => spawnPlane(PLANE_STATES.TAXI_TO_RUNWAY), Math.random() * 3000);
      }
    }
  }

  // Spawn landing planes periodically
  if (Math.random() < dt * 0.15) {
    const startZ = -3500;
    const newPlane = createAirplane(planeColors[planeCount % planeColors.length], 0.8 + Math.random() * 0.5);
    scene.add(newPlane);

    const gate = getGatePosition();
    planes.push({
      mesh: newPlane,
      state: PLANE_STATES.DESCENDING,
      speed: 4,
      targetSpeed: 4,
      scale: newPlane.scale || 1,
      gateX: gate.x,
      gateZ: gate.z,
      runwayX: landingRunway.x,
      taxiInPoint: { x: -300, z: (Math.random() > 0.5 ? 600 : -600) },
      runwayEndZ: landingRunway.length / 2,
      taxiOutPoint: { x: 300, z: (Math.random() > 0.5 ? 600 : -600) },
      climbAngle: 0.04,
      cruiseAltitude: 1200 + Math.random() * 800,
      cruiseDistance: 3000 + Math.random() * 2000,
      distanceTraveled: 0,
      direction: -1,
      beaconPhase: Math.random() * Math.PI * 2,
      navLightPhase: Math.random() * Math.PI * 2,
      landed: false
    });

    newPlane.position.set(landingRunway.x, 1500, startZ);
    // Face +Z direction (forward along approach path)
    newPlane.rotation.y = 0;
    newPlane.rotation.x = -0.04;
    planeCount++;
  }

  // Spawn takeoff planes periodically at gates
  if (Math.random() < dt * 0.1 && planes.filter(p => p.state === PLANE_STATES.TAXI_TO_RUNWAY || p.state === PLANE_STATES.AT_GATE).length < 5) {
    spawnPlane(PLANE_STATES.TAXI_TO_RUNWAY);
  }

  // Update stats display
  statsUpdateTimer += dt;
  if (statsUpdateTimer > 0.5) {
    statsUpdateTimer = 0;
    const taxiing = planes.filter(p => p.state === PLANE_STATES.TAXI_TO_GATE || p.state === PLANE_STATES.TAXI_TO_RUNWAY).length;
    const takeoffs = planes.filter(p => p.state === PLANE_STATES.ON_RUNWAY_TAKEOFF || p.state === PLANE_STATES.CLIMBING).length;
    const landings = planes.filter(p => p.state === PLANE_STATES.DESCENDING || p.state === PLANE_STATES.ON_RUNWAY_LANDING).length;
    const atGate = planes.filter(p => p.state === PLANE_STATES.AT_GATE).length;
    const cruising = planes.filter(p => p.state === PLANE_STATES.CRUISING).length;

    document.getElementById('stats').innerHTML =
      `Taxiing: ${taxiing} | Takeoffs: ${takeoffs} | Landings: ${landings}<br>` +
      `At Gate: ${atGate} | Cruising: ${cruising}`;
  }

  renderer.render(scene, camera);
}

animate();

// --- Windsock ---
function createWindsock(x, z) {
  const group = new THREE.Group();

  // Pole
  const poleGeo = new THREE.CylinderGeometry(0.5, 0.5, 15, 8);
  const poleMat = new THREE.MeshLambertMaterial({ color: 0x666666 });
  const pole = new THREE.Mesh(poleGeo, poleMat);
  pole.position.set(x, 7.5, z);
  group.add(pole);

  // Windsock cone (simplified as a stretched cylinder)
  const sockGeo = new THREE.CylinderGeometry(1, 3, 12, 8, 4);
  const sockMat = new THREE.MeshLambertMaterial({ color: 0xff6600, side: THREE.DoubleSide });
  const sock = new THREE.Mesh(sockGeo, sockMat);
  sock.position.set(x + 7, 13, z);
  sock.rotation.z = -Math.PI / 4;
  group.add(sock);

  scene.add(group);
}
createWindsock(-500, 600);

// --- Resize Handler ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

})();
</script>
