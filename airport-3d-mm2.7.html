<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Airport Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        #canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }
        #info h1 { font-size: 18px; margin-bottom: 10px; color: #4fc3f7; }
        #info p { margin: 5px 0; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="info">
        <h1>✈ 3D Airport Simulation</h1>
        <p>Planes: <span id="planeCount">0</span></p>
        <p>Gates: <span id="gateStatus">0/0</span></p>
    </div>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        // Enhanced fog for smoother horizon transition - starts closer, extends further
        scene.fog = new THREE.Fog(0x1a1a2e, 300, 2500);

        // Use a tighter depth range to reduce flickering/z-fighting on thin pavement slabs.
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.set(300, 200, 400);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;

        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffacd, 1.2);
        sunLight.position.set(200, 300, 100);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 1000;
        sunLight.shadow.camera.left = -800;
        sunLight.shadow.camera.right = 800;
        sunLight.shadow.camera.top = 600;
        sunLight.shadow.camera.bottom = -600;
        scene.add(sunLight);

        // Ground level base: y=0 for grass top surface
        const runwayMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2a2a2a, 
            roughness: 0.8
        });
        const markingMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            roughness: 0.3,
            polygonOffset: true,
            polygonOffsetFactor: -2,
            polygonOffsetUnits: 1
        });
        const taxiwayMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x3a3a3a, 
            roughness: 0.9
        });
        const grassMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2d5a27, 
            roughness: 1
        });
        const concreteMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x7a7a7a, 
            roughness: 0.9
        });
        const buildingMaterial = new THREE.MeshStandardMaterial({ color: 0x5a6a7a, roughness: 0.7 });
        const jetBridgeMaterial = new THREE.MeshStandardMaterial({ color: 0xb0b8c0, roughness: 0.6 });
        const treeTrunkMaterial = new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.9 });
        const treeLeavesMaterial = new THREE.MeshStandardMaterial({ color: 0x1a4a1a, roughness: 0.8 });

        // Ground plane at y=0. Keep paved surfaces slightly above it to avoid z-fighting.
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), grassMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Concrete apron area: centered on the terminal/tower/gate pads and ending before the taxiways.
        const concreteArea = new THREE.Mesh(new THREE.BoxGeometry(230, 0.12, 130), concreteMaterial);
        concreteArea.position.set(-55, 0.06, -15);
        concreteArea.receiveShadow = true;
        scene.add(concreteArea);

        function createRunway(x, z, width, length, rotation) {
            // Runway surface: raised above the apron/grass rather than relying on polygon offsets.
            const runway = new THREE.Mesh(new THREE.BoxGeometry(width, 0.08, length), runwayMaterial);
            runway.position.set(x, 0.18, z); // top surface is y=0.22
            runway.rotation.y = rotation;
            runway.receiveShadow = true;
            scene.add(runway);

            // Center line markings - narrow lengthwise dashes down the runway center.
            const markingGeom = new THREE.BoxGeometry(3, 0.005, 18);
            for (let i = -length / 2 + 20; i < length / 2 - 10; i += 30) {
                const marking = new THREE.Mesh(markingGeom, markingMaterial);
                marking.position.set(
                    x + Math.sin(rotation) * i,
                    0.225,
                    z + Math.cos(rotation) * i
                );
                marking.rotation.y = rotation;
                scene.add(marking);
            }

            // Threshold markings - placed ABOVE runway surface
            const thresholdGeom = new THREE.BoxGeometry(width, 0.005, 8);
            [-length / 2 + 5, length / 2 - 5].forEach(offset => {
                const threshold = new THREE.Mesh(thresholdGeom, markingMaterial);
                threshold.position.set(
                    x + Math.sin(rotation) * offset,
                    0.225,
                    z + Math.cos(rotation) * offset
                );
                threshold.rotation.y = rotation;
                scene.add(threshold);
            });

            return { x, z, width, length, rotation };
        }

        const takeoffRunway = createRunway(200, -100, 40, 300, 0);
        const landingRunway = createRunway(-200, -100, 40, 300, 0);

        function createTaxiwaySegment(p1, p2) {
            const dx = p2.x - p1.x;
            const dz = p2.z - p1.z;
            const length = Math.sqrt(dx * dx + dz * dz);
            if (length < 1) return null;
            const angle = Math.atan2(dx, dz);

            // Taxiway: physically raised above apron/grass to avoid terrain/depth clipping.
            const taxiway = new THREE.Mesh(
                new THREE.BoxGeometry(20, 0.08, length),
                taxiwayMaterial
            );
            taxiway.position.set((p1.x + p2.x) / 2, 0.18, (p1.z + p2.z) / 2);
            taxiway.rotation.y = angle;
            taxiway.receiveShadow = true;
            scene.add(taxiway);
            return { x: (p1.x + p2.x) / 2, z: (p1.z + p2.z) / 2 };
        }

        const taxiwayPaths = [
            // Clean parallel taxiway behind the gate area.
            { start: { x: -200, z: 80 }, end: { x: 200, z: 80 } },

            // Simple runway exits/entries.
            { start: { x: -200, z: 50 }, end: { x: -200, z: 80 } },
            { start: { x: 200, z: 80 }, end: { x: 200, z: 50 } },

            // One apron lane in front of the terminal instead of crossing diagonals.
            { start: { x: -160, z: 55 }, end: { x: 40, z: 55 } },
            { start: { x: -100, z: 80 }, end: { x: -100, z: 55 } },
        ];

        taxiwayPaths.forEach(path => createTaxiwaySegment(path.start, path.end));

        const gates = [];
        const gatePositions = [
            { x: -150, z: 0 }, { x: -120, z: 0 }, { x: -90, z: 0 },
            { x: -60, z: 0 }, { x: -30, z: 0 },
            { x: 0, z: 0 }, { x: 30, z: 0 }
        ];

        gatePositions.forEach((pos, index) => {
            const gateGroup = new THREE.Group();

            // Gate stand marking sits above the raised apron to avoid clipping/flicker.
            const stand = new THREE.Mesh(
                new THREE.BoxGeometry(25, 0.03, 15),
                markingMaterial
            );
            stand.position.set(pos.x, 0.14, pos.z + 20);
            gateGroup.add(stand);

            // Passenger boarding bridge / jet bridge from the terminal toward the parked aircraft.
            const jetBridge = new THREE.Mesh(
                new THREE.BoxGeometry(4, 3, 14),
                jetBridgeMaterial
            );
            jetBridge.position.set(pos.x - 4, 3, pos.z + 8);
            jetBridge.castShadow = true;
            gateGroup.add(jetBridge);

            const bridgeSupport = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 3, 0.8),
                jetBridgeMaterial
            );
            bridgeSupport.position.set(pos.x - 4, 1.5, pos.z + 13);
            bridgeSupport.castShadow = true;
            gateGroup.add(bridgeSupport);

            const leadLight = new THREE.Mesh(
                new THREE.BoxGeometry(1, 2, 1),
                new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 0.5 })
            );
            leadLight.position.set(pos.x + 10, 1, pos.z + 20);
            gateGroup.add(leadLight);

            scene.add(gateGroup);

            gates.push({
                id: index,
                position: { x: pos.x, z: pos.z + 20 },
                occupied: false
            });
        });

        // Single terminal building aligned behind the row of gate pads.
        const terminalBuilding = new THREE.Mesh(
            new THREE.BoxGeometry(215, 15, 12),
            buildingMaterial
        );
        terminalBuilding.position.set(-60, 7.5, -5);
        terminalBuilding.castShadow = true;
        scene.add(terminalBuilding);

        const tower = new THREE.Mesh(
            new THREE.BoxGeometry(15, 40, 15),
            buildingMaterial
        );
        tower.position.set(-10, 20, -60);
        tower.castShadow = true;
        scene.add(tower);

        const towerTop = new THREE.Mesh(
            new THREE.BoxGeometry(20, 10, 20),
            new THREE.MeshStandardMaterial({ color: 0x87ceeb, roughness: 0.2, transparent: true, opacity: 0.7 })
        );
        towerTop.position.set(-10, 45, -60);
        scene.add(towerTop);

        // Tree creation function - only places trees on valid grass areas
        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            
            // Trunk
            const trunkGeom = new THREE.CylinderGeometry(0.8, 1.2, 6, 6);
            const trunk = new THREE.Mesh(trunkGeom, treeTrunkMaterial);
            trunk.castShadow = true;
            treeGroup.add(trunk);
            
            // Leaves (cone shape)
            const leavesGeom = new THREE.ConeGeometry(5, 12, 6);
            const leaves = new THREE.Mesh(leavesGeom, treeLeavesMaterial);
            leaves.position.y = 9;
            leaves.castShadow = true;
            treeGroup.add(leaves);
            
            treeGroup.position.set(x, 0.5, z);
            scene.add(treeGroup);
            return treeGroup;
        }

        // Define no-tree zones (runways, taxiways, gates, approach paths)
        function isValidTreeLocation(x, z) {
            // Buffer zones around airport infrastructure
            const runwayBuffer = 60;
            const taxiwayBuffer = 40;
            const gateBuffer = 50;
            const approachPathBuffer = 80;
            
            // Check takeoff runway (at x=200, extending in z direction)
            if (Math.abs(x - 200) < runwayBuffer && Math.abs(z + 100) < 250) return false;
            
            // Check landing runway (at x=-200, extending in z direction)  
            if (Math.abs(x + 200) < runwayBuffer && Math.abs(z + 100) < 250) return false;
            
            // Check approach/departure paths (in front of runways - where planes fly)
            // Takeoff departure path (planes fly north from takeoff runway)
            if (Math.abs(x - 200) < approachPathBuffer && z < -400) return false;
            
            // Landing approach path (planes come from north to landing runway)
            if (Math.abs(x + 200) < approachPathBuffer && z < -150) return false;
            
            // Check taxiways (main parallel taxiway at z=80)
            if (Math.abs(z - 80) < taxiwayBuffer && Math.abs(x) < 250) return false;
            
            // Check gate/terminal area
            if (Math.abs(z) < gateBuffer && x > -200 && x < 100) return false;
            
            // Check tower area
            if (Math.abs(x + 10) < 40 && Math.abs(z + 60) < 40) return false;
            
            return true;
        }

        // Spawn trees randomly on valid grass areas
        const treeCount = 150;
        const treeSpread = 1400;
        
        for (let i = 0; i < treeCount; i++) {
            let x, z, attempts = 0;
            do {
                x = (Math.random() - 0.5) * treeSpread;
                z = (Math.random() - 0.5) * treeSpread;
                attempts++;
            } while (!isValidTreeLocation(x, z) && attempts < 10);
            
            if (attempts < 10) {
                createTree(x, z);
            }
        }

        // Global runway clearance tracking - only one plane on approach/landing at a time
        let runwayOccupied = false;
        let lastLandingTime = 0;
        const MIN_LANDING_INTERVAL = 120; // Minimum frames between landings for spacing

        // Holding pattern parameters - elongated oval aligned with landing runway approach
        // Planes approach from NORTH, flying south toward the runway
        // Landing runway: x=-200, z from -250 (north end) to 50 (south end/threshold)
        const holdingPattern = {
            centerX: -80,           // Center x so approach arm is at x=-200 (aligned with runway)
            centerZ: -350,          // Center point z - positioned so bottom (north end) is near runway
            longRadius: 400,        // North-south extent (half-length) - extends to horizon
            shortRadius: 120,       // East-west width (half-width) - offset for return arm
            altitude: 150,          // Holding pattern altitude
            speed: 0.0025           // Angular speed around oval (slower for larger pattern)
        };
        // Top of oval (north, near horizon): centerZ - longRadius = -350 - 400 = -750 (spawn point)
        // Bottom of oval (south, near runway): centerZ + longRadius = -350 + 400 = 50 (near runway threshold)
        // Approach arm (east side, angle PI/2): x = centerX + shortRadius = -80 + 120 = 40 (return arm)
        // Wait, let me recalculate for approach from north:
        // At angle 0: sin=0, cos=1 -> z = -350 + 400 = 50 (south end, near runway)
        // At angle PI/2: sin=1, cos=0 -> x = -80 + 120 = 40 (east side)
        // At angle PI: sin=0, cos=-1 -> z = -350 - 400 = -750 (north end, horizon)
        // At angle 3PI/2: sin=-1, cos=0 -> x = -80 - 120 = -200 (west side, approach arm aligned with runway)
        // Counter-clockwise orbit: north -> west (approach, flying south toward runway) -> south -> east (return) -> north

        class Plane {
            constructor() {
                this.mesh = new THREE.Group();

                const fuselageGeom = new THREE.CylinderGeometry(1.5, 1.5, 12, 8);
                fuselageGeom.rotateX(Math.PI / 2);
                const fuselage = new THREE.Mesh(fuselageGeom, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }));
                fuselage.castShadow = true;
                this.mesh.add(fuselage);

                const wingGeom = new THREE.BoxGeometry(18, 0.3, 4);
                const wing = new THREE.Mesh(wingGeom, new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 }));
                wing.position.z = -1;
                wing.castShadow = true;
                this.mesh.add(wing);

                const tailGeom = new THREE.BoxGeometry(6, 0.3, 2);
                const tail = new THREE.Mesh(tailGeom, new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 }));
                tail.position.z = -5;
                tail.castShadow = true;
                this.mesh.add(tail);

                const vertTailGeom = new THREE.BoxGeometry(0.3, 3, 2);
                const vertTail = new THREE.Mesh(vertTailGeom, new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 }));
                vertTail.position.set(0, 1.5, -5);
                this.mesh.add(vertTail);

                const engineGeom = new THREE.CylinderGeometry(0.6, 0.6, 3, 8);
                engineGeom.rotateZ(Math.PI / 2);
                [-5, 5].forEach(xOff => {
                    const engine = new THREE.Mesh(engineGeom, new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 }));
                    engine.position.set(xOff, -1, 2);
                    this.mesh.add(engine);
                });

                const colors = [0xff4444, 0x4444ff, 0x44ff44, 0xffff44, 0xff44ff, 0x44ffff];
                const noseGeom = new THREE.ConeGeometry(1.5, 3, 8);
                noseGeom.rotateX(-Math.PI / 2);
                const nose = new THREE.Mesh(noseGeom, new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)], roughness: 0.3 }));
                nose.position.z = -7;
                this.mesh.add(nose);

                scene.add(this.mesh);

                this.state = 'enteringHolding';
                this.targetGate = null;
                this.currentPathIndex = 0;
                this.speed = 3;
                this.verticalSpeed = 0;
                this.waitTime = 0;
                this.respawnTimer = 200;
                
                // Holding pattern state
                this.holdingAngle = Math.random() * Math.PI * 2; // Start at random position in oval
                this.holdingTimer = 0;
                
                // Spawn from horizon (north side, offscreen) and fly to holding pattern entry
                // Planes approach from north, flying south toward the airport (same direction as landing)
                this.spawnPosition = { x: -200, y: 150, z: -850 }; // Far north of airport (beyond oval), high altitude
                this.holdingEntryPoint = { 
                    x: -200,  // Enter on the approach arm (aligned with runway at x=-200)
                    z: holdingPattern.centerZ - holdingPattern.longRadius + 30, // Near north end of oval (close to spawn)
                    y: holdingPattern.altitude
                };
                
                this.mesh.position.set(this.spawnPosition.x, this.spawnPosition.y, this.spawnPosition.z);
                this.mesh.rotation.y = Math.PI; // Face south toward holding pattern/runway
            }

            update() {
                switch (this.state) {
                    case 'enteringHolding':
                        // Fly from spawn position to holding pattern entry point (north end)
                        const dx = this.holdingEntryPoint.x - this.mesh.position.x;
                        const dz = this.holdingEntryPoint.z - this.mesh.position.z;
                        const dy = this.holdingEntryPoint.y - this.mesh.position.y;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        
                        if (dist < 10) {
                            // Reached holding pattern entry, start orbiting on approach arm (west side)
                            this.state = 'inHolding';
                            // Position at north end of oval, on approach arm (x=-200)
                            this.holdingAngle = Math.PI; // North end of oval (near horizon)
                            this.mesh.position.set(this.holdingEntryPoint.x, this.holdingEntryPoint.y, this.holdingEntryPoint.z);
                            this.mesh.rotation.y = Math.PI; // Face south (toward runway)
                        } else {
                            // Fly toward holding pattern entry (north to south, same direction as landing)
                            const moveSpeed = 8;
                            this.mesh.position.x += (dx / dist) * moveSpeed;
                            this.mesh.position.z += (dz / dist) * moveSpeed;
                            this.mesh.position.y += dy * 0.02; // Gradual descent to holding altitude
                            this.mesh.rotation.y = Math.atan2(dx, dz); // Face direction of travel (south)
                        }
                        break;

                    case 'inHolding':
                        // Orbit in elongated oval pattern, waiting for runway clearance
                        // Counter-clockwise orbit: start at north end (near horizon), go down west side (approach arm aligned with runway, flying south),
                        // across south end, up east side (return arm offset to east) back to north
                        this.holdingTimer++;
                        this.holdingAngle += holdingPattern.speed;
                        
                        // Calculate oval position: elongated north-south
                        const cosAngle = Math.cos(this.holdingAngle);
                        const sinAngle = Math.sin(this.holdingAngle);
                        
                        // Oval parametric equation (counter-clockwise, starting from north at angle PI)
                        // At angle 0: sin=0, cos=1 -> z = -350 + 400 = 50 (south end, near runway threshold)
                        // At angle PI/2: sin=1, cos=0 -> x = -80 + 120 = 40 (east side, return arm flying north)
                        // At angle PI: sin=0, cos=-1 -> z = -350 - 400 = -750 (north end, near horizon)
                        // At angle 3PI/2: sin=-1, cos=0 -> x = -80 - 120 = -200 (west side, approach arm aligned with runway, flying south)
                        this.mesh.position.x = holdingPattern.centerX + holdingPattern.shortRadius * sinAngle;
                        this.mesh.position.z = holdingPattern.centerZ + holdingPattern.longRadius * cosAngle;
                        this.mesh.position.y = holdingPattern.altitude;
                        
                        // Calculate velocity direction for rotation (tangent to oval, counter-clockwise)
                        // dx/dt = shortRadius * cos(angle), dz/dt = -longRadius * sin(angle)
                        const velX = holdingPattern.shortRadius * cosAngle;
                        const velZ = -holdingPattern.longRadius * sinAngle;
                        this.mesh.rotation.y = Math.atan2(velX, velZ);
                        
                        // Check if runway is clear and enough time since last landing
                        // Only allow exit from west side (approach arm, flying south toward runway)
                        const framesSinceLanding = Date.now() - lastLandingTime;
                        // sinAngle < 0 means we're on west side (approach arm at x=-200, flying south toward runway)
                        // cosAngle > 0 means we're in southern half (approaching runway end)
                        // Combined: sinAngle < -0.5 && cosAngle > 0 means we're on approach arm in southern half, flying south
                        if (framesSinceLanding > MIN_LANDING_INTERVAL * 16 && !runwayOccupied && sinAngle < -0.5 && cosAngle > 0) {
                            // Runway is clear, exit holding pattern and start approach from current position on approach arm
                            this.state = 'approaching';
                            const runwayEntryZ = landingRunway.z - landingRunway.length / 2; // North end of runway
                            this.approachStart = { x: landingRunway.x, z: this.mesh.position.z + 50, y: this.mesh.position.y };
                            this.approachEnd = { x: landingRunway.x, z: runwayEntryZ - 20, y: 6 };
                            this.approachProgress = 0;
                            runwayOccupied = true; // Claim the runway
                        }
                        break;

                    case 'spawning':
                        this.taxiToTarget();
                        if (this.isAtGate()) {
                            this.state = 'atGate';
                        }
                        break;

                    case 'taxiingToGate':
                        this.taxiToTarget();
                        if (this.isAtGate()) {
                            this.state = 'atGate';
                        }
                        break;

                    case 'atGate':
                        this.waitTime++;
                        if (this.waitTime > 200) {
                            this.waitTime = 0;
                            this.state = 'taxiingToTakeoff';
                            const path = [
                                { x: this.targetGate.position.x, z: this.targetGate.position.z, y: 0.5 },
                                { x: this.targetGate.position.x, z: 55, y: 0.5 },
                                { x: -100, z: 55, y: 0.5 },
                                { x: -100, z: 80, y: 0.5 },
                                { x: takeoffRunway.x, z: 80, y: 0.5 },
                                { x: takeoffRunway.x, z: takeoffRunway.z + takeoffRunway.length / 2, y: 0.5 }
                            ];
                            this.taxiPath = path;
                            this.currentPathIndex = 0;
                        }
                        break;

                    case 'taxiingToTakeoff':
                        this.taxiToTarget();
                        if (this.isNearRunwayEntry()) {
                            this.state = 'takingOff';
                        }
                        break;

                    case 'takingOff':
                        // Accelerate along runway
                        this.speed = Math.min(this.speed + 0.2, 12);
                        
                        // Move down the takeoff runway centerline, opposite the landing direction.
                        this.mesh.position.x = takeoffRunway.x;
                        this.mesh.position.z -= this.speed;
                        this.mesh.rotation.y = Math.PI;
                        
                        // Speed-based lift: gradual takeoff after building speed
                        const runwayProgress = Math.max(0, (takeoffRunway.z + takeoffRunway.length / 2 - this.mesh.position.z) / takeoffRunway.length);
                        const liftFactor = Math.min(1, this.speed / 10) * runwayProgress;
                        
                        if (runwayProgress > 0.3 && this.speed > 6) {
                            this.mesh.position.y = Math.min(this.mesh.position.y + liftFactor * 0.8, 60);
                        }
                        
                        // Transition to flying away once at altitude
                        if (this.mesh.position.y >= 60) {
                            this.state = 'flyingAway';
                            this.speed = 8;
                        }
                        break;

                    case 'flyingAway':
                        // Continue straight away from the airport and climb offscreen.
                        this.mesh.position.x = takeoffRunway.x;
                        this.mesh.position.z -= 18;
                        this.mesh.position.y += 0.4;
                        this.mesh.rotation.y = Math.PI;

                        if (this.mesh.position.z < -800) {
                            this.state = 'respawning';
                            this.mesh.visible = false;
                            this.respawnTimer = 300 + Math.random() * 200;
                        }
                        break;

                    case 'respawning':
                        this.respawnTimer--;
                        if (this.respawnTimer <= 0) {
                            // Release old gate if we had one
                            if (this.targetGate) {
                                this.targetGate.occupied = false;
                                this.targetGate = null;
                            }

                            // Reset to entering holding pattern from horizon
                            this.state = 'enteringHolding';
                            this.mesh.position.set(this.spawnPosition.x, this.spawnPosition.y, this.spawnPosition.z);
                            this.mesh.visible = true;
                            this.mesh.rotation.y = 0;
                        }
                        break;

                    case 'approaching':
                        // Smooth continuous descent using linear interpolation
                        this.approachProgress += 0.008; // Constant speed along approach path
                        
                        if (this.approachProgress >= 1) {
                            // Find and reserve a gate before landing completes
                            if (!this.targetGate) {
                                this.targetGate = this.findAvailableGate();
                                if (this.targetGate) {
                                    this.targetGate.occupied = true;
                                }
                            }
                            this.state = 'landing';
                            this.verticalSpeed = 0;
                            this.speed = 6;
                        } else {
                            // Interpolate position for smooth glideslope
                            this.mesh.position.x = this.approachStart.x + (this.approachEnd.x - this.approachStart.x) * this.approachProgress;
                            this.mesh.position.z = this.approachStart.z + (this.approachEnd.z - this.approachStart.z) * this.approachProgress;
                            this.mesh.position.y = this.approachStart.y + (this.approachEnd.y - this.approachStart.y) * this.approachProgress;
                            this.mesh.rotation.y = 0; // Face the runway direction
                        }
                        break;

                    case 'landing':
                        this.mesh.position.x = landingRunway.x;
                        this.mesh.rotation.y = 0;

                        if (this.mesh.position.y > 0.5) {
                            this.verticalSpeed = Math.max(this.verticalSpeed + 0.04, 0.15);
                            this.mesh.position.y = Math.max(0.5, this.mesh.position.y - this.verticalSpeed);
                        }

                        if (this.mesh.position.z < landingRunway.z + landingRunway.length / 2) {
                            this.mesh.position.z += Math.max(this.speed * 0.8, 4);
                            this.speed = Math.max(this.speed * 0.98, 4);
                        } else {
                            // Landed - release runway and taxi to gate
                            runwayOccupied = false; // Release the runway
                            lastLandingTime = Date.now(); // Record landing time for spacing
                            // Landed - taxi to gate if we have one, otherwise wait for one
                            if (this.targetGate) {
                                this.state = 'taxiingToGate';
                                const path = [
                                    { x: landingRunway.x, z: landingRunway.z + landingRunway.length / 2, y: 0.5 },
                                    { x: landingRunway.x, z: 80, y: 0.5 },
                                    { x: -100, z: 80, y: 0.5 },
                                    { x: -100, z: 55, y: 0.5 },
                                    { x: this.targetGate.position.x, z: 55, y: 0.5 },
                                    { x: this.targetGate.position.x, z: this.targetGate.position.z, y: 0.5 }
                                ];
                                this.taxiPath = path;
                                this.currentPathIndex = 0;
                                this.speed = 3;
                            } else {
                                // No gate available - keep waiting on runway (shouldn't happen often)
                                const newGate = this.findAvailableGate();
                                if (newGate) {
                                    newGate.occupied = true;
                                    this.targetGate = newGate;
                                    this.state = 'taxiingToGate';
                                    const path = [
                                        { x: landingRunway.x, z: landingRunway.z + landingRunway.length / 2, y: 0.5 },
                                        { x: landingRunway.x, z: 80, y: 0.5 },
                                        { x: -100, z: 80, y: 0.5 },
                                        { x: -100, z: 55, y: 0.5 },
                                        { x: this.targetGate.position.x, z: 55, y: 0.5 },
                                        { x: this.targetGate.position.x, z: this.targetGate.position.z, y: 0.5 }
                                    ];
                                    this.taxiPath = path;
                                    this.currentPathIndex = 0;
                                    this.speed = 3;
                                } else {
                                    // Still no gate - move to holding area off runway to avoid blocking
                                    this.state = 'holding';
                                    this.holdingTimer = 0;
                                }
                            }
                        }
                        break;

                    case 'holding':
                        // Wait on taxiway holding area for gate to become available
                        this.holdingTimer++;
                        
                        // Check for available gate periodically
                        if (this.holdingTimer % 60 === 0) {
                            const newGate = this.findAvailableGate();
                            if (newGate) {
                                newGate.occupied = true;
                                this.targetGate = newGate;
                                // Taxi directly to gate from current position (already on ground)
                                this.state = 'taxiingToGate';
                                const path = [
                                    { x: this.mesh.position.x, z: this.mesh.position.z, y: 0.5 },
                                    { x: -100, z: 80, y: 0.5 },
                                    { x: -100, z: 55, y: 0.5 },
                                    { x: this.targetGate.position.x, z: 55, y: 0.5 },
                                    { x: this.targetGate.position.x, z: this.targetGate.position.z, y: 0.5 }
                                ];
                                this.taxiPath = path;
                                this.currentPathIndex = 0;
                                this.speed = 3;
                            }
                        }
                        
                        // Hold position on taxiway near terminal
                        const holdAngle = this.holdingTimer * 0.02;
                        const holdRadius = 30;
                        this.mesh.position.x = -100 + Math.sin(holdAngle) * holdRadius;
                        this.mesh.position.z = 80 + Math.cos(holdAngle) * holdRadius;
                        this.mesh.position.y = 0.5;
                        this.mesh.rotation.y = Math.atan2(Math.cos(holdAngle), -Math.sin(holdAngle));
                        break;
                }

                return true;
            }


            taxiToTarget() {
                if (this.currentPathIndex >= this.taxiPath.length - 1) return;

                const target = this.taxiPath[this.currentPathIndex + 1];
                if (!target) return;

                const dx = target.x - this.mesh.position.x;
                const dz = target.z - this.mesh.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);

                if (dist < 3) {
                    this.currentPathIndex++;
                } else {
                    const moveSpeed = Math.min(this.speed, dist);
                    this.mesh.position.x += (dx / dist) * moveSpeed;
                    this.mesh.position.z += (dz / dist) * moveSpeed;

                    const targetAngle = Math.atan2(dx, dz);
                    let angleDiff = targetAngle - this.mesh.rotation.y;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    this.mesh.rotation.y += angleDiff * 0.1;

                    if (this.state === 'taxiingToTakeoff') {
                        if (Math.abs(this.mesh.position.x - takeoffRunway.x) < 15 &&
                            Math.abs(this.mesh.position.z - (takeoffRunway.z + takeoffRunway.length / 2)) < 20) {
                            this.state = 'takingOff';
                        }
                    }

                    if (this.state === 'spawning' || this.state === 'taxiingToGate') {
                        const gateDist = Math.sqrt(
                            Math.pow(this.mesh.position.x - this.targetGate.position.x, 2) +
                            Math.pow(this.mesh.position.z - this.targetGate.position.z, 2)
                        );
                        if (gateDist < 5) {
                            this.state = 'atGate';
                        }
                    }
                }
            }

            isAtGate() {
                if (!this.targetGate) return false;
                const dist = Math.sqrt(
                    Math.pow(this.mesh.position.x - this.targetGate.position.x, 2) +
                    Math.pow(this.mesh.position.z - this.targetGate.position.z, 2)
                );
                return dist < 5 && Math.abs(this.mesh.position.y - 0.5) < 1;
            }

            isNearRunwayEntry() {
                return Math.abs(this.mesh.position.x - takeoffRunway.x) < 15 &&
                       Math.abs(this.mesh.position.z - (takeoffRunway.z + takeoffRunway.length / 2)) < 20;
            }

            findAvailableGate() {
                const available = gates.filter(g => !g.occupied);
                if (available.length > 0) {
                    return available[Math.floor(Math.random() * available.length)];
                }
                return null;
            }

            destroy() {
                scene.remove(this.mesh);
                if (this.targetGate) this.targetGate.occupied = false;
            }
        }

        const planes = [];
        const maxPlanes = 8;

        function spawnPlane() {
            // Spawn planes at staggered intervals - they'll approach from north and land first
            // Gate assignment happens during approach, so planes can spawn even if gates are full
            if (planes.length < maxPlanes) {
                planes.push(new Plane());
            }
        }

        // Initial spawn with staggered timing for realistic spacing
        spawnPlane();
        setTimeout(spawnPlane, 4000);
        setTimeout(spawnPlane, 8000);
        setTimeout(spawnPlane, 12000);
        // Continue spawning periodically to maintain traffic
        setInterval(spawnPlane, 15000);

        function updateUI() {
            document.getElementById('planeCount').textContent = planes.length;
            const occupiedGates = gates.filter(g => g.occupied).length;
            document.getElementById('gateStatus').textContent = `${occupiedGates}/${gates.length}`;
        }

        function animate() {
            requestAnimationFrame(animate);

            for (let i = planes.length - 1; i >= 0; i--) {
                if (!planes[i].update()) {
                    planes[i].destroy();
                    planes.splice(i, 1);
                }
            }

            updateUI();
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
