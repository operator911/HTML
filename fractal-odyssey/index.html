<!DOCTYPE html>
<!-- Fractal Odyssey — coded by Qwen3.8-Flash-Next Q5. Source: ./fractal-odyssey/ (npm run build:standalone regenerates the root file) -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="author" content="Qwen3.8-Flash-Next Q5" />
<title>Fractal Odyssey — An Interactive Mathematical Universe</title>
<meta name="description" content="Travel through an infinite mathematical universe: fourteen GPU-rendered fractal worlds, from a 10^14-deep Mandelbrot to hyperbolic tilings, Kleinian limit sets and fractal flames." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23050608'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d9a441' stroke-width='1.5'/%3E%3Ccircle cx='21' cy='11' r='3.2' fill='%2359c7e8'/%3E%3C/svg%3E" />
<style>
  /* Critical paint: the app is a black canvas that fills instantly. */
  html, body { margin: 0; padding: 0; background: #04050a; overflow: hidden; height: 100%;
    overscroll-behavior: none; }
  /* The canvas owns all touch gestures; without touch-action:none the browser
     hijacks horizontal drags as back/scroll gestures on phones, which sends
     pointercancel mid-drag and makes left/right pan feel inverted. */
  /* The canvas yields room to the tune panel: a right gutter (--ribbon-w) or a
     bottom sheet (--sheet-h) — set on <html> by the UI, 0 otherwise — so the
     controls never mask the show. display:block + no margin avoids inline
     baseline gaps shifting the sheet height. */
  #view { display: block; width: calc(100% - var(--ribbon-w, 0px));
    height: calc(100% - var(--sheet-h, 0px)); touch-action: none; }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #6f7690; font: 400 13px/1.6 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .35em; text-transform: uppercase; user-select: none; pointer-events: none;
    transition: opacity .6s ease;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="boot">entering the odyssey</div>
<div id="ui"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
