<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fractal Odyssey — Swift1.5-Qwen3.8-Flash-Next Edition</title>

  <style>
    /* Pre-paint splash so the first frame is never a white flash. */
    html, body { margin: 0; padding: 0; background: #05070d; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #7f8ba3; font: 500 13px/1.6 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: .22em; text-transform: uppercase;
      background: radial-gradient(120% 90% at 50% 55%, #0a1020 0%, #05070d 70%);
      transition: opacity .8s ease; z-index: 0;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
